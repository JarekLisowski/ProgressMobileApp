<div class="modal" #addProductModal id="addProductModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Dodaj do koszyka</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" (click)="hide()"></button>
      </div>
      <div class="modal-body">
        <p>{{ product?.name }}</p>
        <div class="d-flex justify-content-center my-3">
          <quantity [minQuantity]="1" [quantity]="quantity" (quntityChanged)="quantityChanged($event)">
          </quantity>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" (click)="hide()">Anuluj</button>
        <button type="button" class="btn btn-primary" (click)="addToCart()">Dodaj</button>
      </div>
    </div>
  </div>
</div>
