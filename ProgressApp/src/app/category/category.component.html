<h3>{{categoryName}}</h3>
<div class="d-flex justify-content-between align-items-center">
  <div class="form-check form-switch">
    <input class="form-check-input" type="checkbox" role="switch" id="switchCheckChecked" [(ngModel)]="onlyAvailable">
    <label class="form-check-label" for="switchCheckChecked">Tylko dostępne</label>
  </div>
  <div>
    @if (viewStyle == 1) {
      <button (click)="setViewStyle(0)" type="button" class="btn btn-outline-primary"><i class="bi bi-grid"></i></button>
    }
    @if (viewStyle == 0) {
      <button (click)="setViewStyle(1)" type="button" class="btn btn-outline-primary"><i class="bi bi-list-ul"></i></button>
    }
  </div>
</div>

@if (viewStyle == 0) {
<app-product-grid-5 [items]="products">
</app-product-grid-5>
}
@else {
<product-list [items]="products">
</product-list>
}
