<h3>{{categoryName}}</h3>
<div class="d-flex justify-content-between align-items-center">
  <div class="form-check form-switch">
    <input class="form-check-input" type="checkbox" role="switch" id="switchCheckChecked" [(ngModel)]="onlyAvailable">
    <label class="form-check-label" for="switchCheckChecked">Tylko dostępne</label>
  </div>
  <div>
    @if (viewStyle == 1) {
    <button (click)="setViewStyle(0)" type="button" class="btn btn-outline-primary"><i class="bi bi-grid"></i></button>
    }
    @if (viewStyle == 0) {
    <button (click)="setViewStyle(1)" type="button" class="btn btn-outline-primary"><i
        class="bi bi-list-ul"></i></button>
    }
  </div>
</div>
<div class="d-flex flex-wrap">
  @for (item of categoriesFiltered; track item.id) {
  <div class="border rounded p-1 me-2 mb-2 border-primary" [class.active-category]="isGroupSelected(item.id)">
    <a [routerLink]="['/brand', categoryId]" [queryParams]="{group: item.id}">
      {{item.name}}
    </a>
  </div>
  }
  @if (showAllButton) {
  <div class="border rounded p-1 me-2 mb-2 border-primary">
    <a [routerLink]="['/brand', categoryId]">
      wszystko
    </a>
  </div>
  }
  @if (showAllGroupsButton) { <div class="border rounded p-1 me-2 mb-2 border-primary">
    <a style="cursor: pointer;" (click)="showAllCategories()">pokaż więcej ...</a>
  </div>
  }
</div>

@if (viewStyle == 0) {
<app-product-grid-5 [items]="products">
</app-product-grid-5>
}
@else {
<product-list [items]="products">
</product-list>
}
